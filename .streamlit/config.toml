# Based on Streamlit 1.63's bundled financial-dashboard theme.
# Server settings are intentionally omitted here. Streamlit Community Cloud
# owns its health-check port; scripts/run_lan.cmd supplies the LAN-only
# address, port and headless flags explicitly.

[theme]
base = "dark"
primaryColor = "#60A5FA"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#60A5FA"
borderColor = "#334155"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
greenColor = "#34D399"
redColor = "#F87171"
yellowColor = "#FBBF24"
blueColor = "#60A5FA"
grayColor = "#94A3B8"
chartCategoricalColors = [
    "#60A5FA",
    "#34D399",
    "#A78BFA",
    "#F87171",
    "#FBBF24",
    "#38BDF8",
    "#94A3B8",
    "#FB923C",
]
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#60A5FA"
